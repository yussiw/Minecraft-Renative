name: Build APK TV
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unzip project
        run: unzip -oq projeto-tv.zip -d proj
      - name: Create signing key
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build release APK
        working-directory: proj/blocos
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Copy APK
        run: cp proj/blocos/app/build/outputs/apk/release/app-release.apk blocos-tv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: blocos-tv-apk
          path: blocos-tv.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-build-${{ github.run_number }}
          name: Blocos TV build ${{ github.run_number }}
          files: blocos-tv.apk
          prerelease: true
