plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.renative.minecraft'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'dev.renative.minecraft'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -Wall -Wextra'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
